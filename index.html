<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#8B5CF6">

<meta
  name="description"
  content="NEXO — conecta, descubre y hazlo."
>

<link rel="manifest" href="./manifest.json">

<title>NEXO</title>

<style>

/* =========================================================
   NEXO 4.0 — SISTEMA VISUAL
========================================================= */

:root{
  --primary:#8B5CF6;
  --primary-dark:#6D28D9;
  --primary-light:#F0EAFF;

  --bg:#F7F5FC;
  --card:#FFFFFF;
  --card-2:#FAF9FD;

  --text:#17151F;
  --muted:#777383;

  --border:#E8E4F0;

  --success:#22C55E;
  --warning:#F59E0B;
  --danger:#EF4444;
  --info:#3B82F6;

  --shadow:
    0 8px 30px rgba(20,10,50,.055);

  --radius:20px;
  --radius-small:14px;

  --safe-bottom:env(safe-area-inset-bottom);
  --safe-top:env(safe-area-inset-top);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  margin:0;
  padding:0;
  scroll-behavior:smooth;
}

body{
  margin:0;
  padding:0;

  min-height:100vh;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

  background:var(--bg);
  color:var(--text);

  transition:
    background .25s ease,
    color .25s ease;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

img{
  display:block;
  max-width:100%;
}

a{
  color:inherit;
  text-decoration:none;
}

.hidden{
  display:none!important;
}

.no-scroll{
  overflow:hidden;
}


/* =========================================================
   APP
========================================================= */

#app{
  width:100%;
  max-width:760px;

  min-height:100vh;

  margin:0 auto;

  padding-bottom:
    calc(100px + var(--safe-bottom));
}


/* =========================================================
   HEADER
========================================================= */

.app-header{

  position:sticky;
  top:0;

  z-index:100;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:
    calc(12px + var(--safe-top))
    18px
    12px;

  background:
    rgba(247,245,252,.90);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  border-bottom:1px solid var(--border);
}

.logo{

  font-size:26px;
  line-height:1;

  font-weight:950;

  letter-spacing:-1.5px;

  background:
    linear-gradient(
      135deg,
      #8B5CF6,
      #6D28D9
    );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;
}

.header-subtitle{

  margin-top:4px;

  font-size:11px;

  color:var(--muted);
}

.header-actions{

  display:flex;

  align-items:center;

  gap:7px;
}

.icon-btn{

  width:40px;
  height:40px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid var(--border);

  border-radius:50%;

  background:var(--card);

  box-shadow:
    0 4px 15px rgba(0,0,0,.045);

  transition:
    transform .15s,
    background .15s;
}

.icon-btn:active{
  transform:scale(.92);
}


/* =========================================================
   SCREENS
========================================================= */

.screen{

  display:none;

  padding:
    18px
    18px
    25px;
}

.screen.active{
  display:block;
}


/* =========================================================
   HERO
========================================================= */

.hero{

  padding:
    7px
    2px
    18px;
}

.hero h1{

  margin:
    5px
    0
    8px;

  font-size:30px;

  line-height:1.12;

  letter-spacing:-1px;
}

.hero p{

  margin:0;

  color:var(--muted);

  line-height:1.5;
}

.eyebrow{

  color:var(--primary);

  font-size:12px;

  font-weight:900;

  text-transform:uppercase;

  letter-spacing:.5px;
}


/* =========================================================
   SECTION TITLE
========================================================= */

.section-title{

  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin:
    22px
    0
    12px;
}

.section-title h2{

  margin:0;

  font-size:19px;

  letter-spacing:-.3px;
}

.section-title h1{

  margin:0;

  font-size:27px;

  letter-spacing:-.8px;
}


/* =========================================================
   SEARCH
========================================================= */

.search-box{

  display:flex;

  align-items:center;

  gap:10px;

  width:100%;

  padding:
    12px
    15px;

  background:var(--card);

  border:
    1px
    solid
    var(--border);

  border-radius:17px;

  box-shadow:
    0 5px 20px rgba(0,0,0,.025);
}

.search-icon{
  flex:none;
  font-size:19px;
}

.search-box input{

  width:100%;

  min-width:0;

  border:0;
  outline:0;

  background:transparent;

  color:var(--text);

  font-size:14px;
}

.search-box input::placeholder{
  color:#9A96A5;
}


/* =========================================================
   CARDS
========================================================= */

.card{

  position:relative;

  width:100%;

  padding:16px;

  margin-bottom:12px;

  background:var(--card);

  border:
    1px
    solid
    var(--border);

  border-radius:var(--radius);

  box-shadow:var(--shadow);

  overflow:hidden;
}

.card h3{

  margin:
    0
    0
    5px;

  font-size:17px;
}

.card p{
  margin:0;
}


/* =========================================================
   PHOTO CARDS
========================================================= */

.photo-card{

  padding:0;

  overflow:hidden;
}

.photo-card-image{

  position:relative;

  width:100%;

  height:185px;

  overflow:hidden;

  background:#EEEAF7;
}

.photo-card-image img{

  width:100%;
  height:100%;

  object-fit:cover;

  transition:
    transform .35s ease;
}

.photo-card:hover
.photo-card-image img{
  transform:scale(1.03);
}

.photo-card-overlay{

  position:absolute;

  left:0;
  right:0;
  bottom:0;

  padding:
    45px
    15px
    13px;

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.72)
    );

  color:white;
}

.photo-card-overlay h3{

  margin:0;

  font-size:19px;
}

.photo-card-overlay p{

  margin:4px 0 0;

  font-size:12px;

  opacity:.9;
}

.photo-card-body{
  padding:14px;
}


/* =========================================================
   AVATARS
========================================================= */

.avatar{

  width:56px;
  height:56px;

  flex:none;

  object-fit:cover;

  border-radius:50%;

  background:#EEEAF7;

  border:
    2px
    solid
    var(--card);
}

.avatar-small{

  width:40px;
  height:40px;
}

.avatar-large{

  width:92px;
  height:92px;
}


/* =========================================================
   PERSON
========================================================= */

.person{

  display:flex;

  align-items:center;

  gap:12px;
}

.person-main{
  flex:1;
  min-width:0;
}

.person-main h3{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.person-actions{

  display:flex;

  gap:6px;

  flex:none;
}

.compatibility{

  display:inline-flex;

  align-items:center;

  gap:3px;

  margin-top:3px;

  color:#7042D8;

  font-size:12px;

  font-weight:900;
}


/* =========================================================
   BUTTONS
========================================================= */

.primary-btn{

  border:0;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary-dark)
    );

  color:white;

  padding:
    11px
    15px;

  border-radius:13px;

  font-weight:850;

  box-shadow:
    0 6px 15px rgba(139,92,246,.18);

  transition:
    transform .15s,
    opacity .15s;
}

.primary-btn:active{
  transform:scale(.96);
}

.secondary-btn{

  border:0;

  background:var(--primary-light);

  color:#6237C7;

  padding:
    10px
    14px;

  border-radius:13px;

  font-weight:750;
}

.ghost-btn{

  border:
    1px
    solid
    var(--border);

  background:var(--card);

  color:var(--text);

  padding:
    10px
    13px;

  border-radius:13px;

  font-weight:700;
}

.danger-btn{

  border:0;

  background:#FEE2E2;

  color:#B91C1C;

  padding:
    11px
    15px;

  border-radius:13px;

  font-weight:800;
}

.full-btn{
  width:100%;
}


/* =========================================================
   QUICK GRID
========================================================= */

.quick-grid{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:8px;
}

.quick-card{

  min-width:0;

  border:
    1px
    solid
    var(--border);

  background:var(--card);

  border-radius:16px;

  padding:
    12px
    5px;

  text-align:center;

  font-size:11px;

  box-shadow:
    0 5px 15px rgba(0,0,0,.025);

  transition:
    transform .15s;
}

.quick-card:active{
  transform:scale(.96);
}

.quick-card .emoji{

  display:block;

  font-size:25px;

  margin-bottom:6px;
}

.quick-card .count{

  display:block;

  margin-top:3px;

  color:var(--muted);

  font-size:9px;
}


/* =========================================================
   CHIPS
========================================================= */

.chips{

  display:flex;

  flex-wrap:wrap;

  gap:7px;

  margin-bottom:12px;
}

.chip{

  border:0;

  background:var(--primary-light);

  color:#6439C7;

  padding:
    7px
    10px;

  border-radius:999px;

  font-size:11px;

  font-weight:700;

  white-space:nowrap;
}

.chip.active{

  background:var(--primary);

  color:white;
}


/* =========================================================
   NOW
========================================================= */

.now-card{

  display:flex;

  align-items:center;

  gap:12px;
}

.now-icon{

  width:52px;
  height:52px;

  flex:none;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:16px;

  background:var(--primary-light);

  font-size:26px;
}

.grow{
  flex:1;
  min-width:0;
}


/* =========================================================
   META
========================================================= */

.meta{

  display:flex;

  flex-wrap:wrap;

  gap:8px;

  margin-top:8px;

  color:var(--muted);

  font-size:11px;
}

.meta span{
  display:inline-flex;
  align-items:center;
  gap:3px;
}


/* =========================================================
   BADGES
========================================================= */

.badge{

  display:inline-flex;

  align-items:center;

  gap:4px;

  width:max-content;

  padding:
    5px
    8px;

  border-radius:999px;

  font-size:10px;

  font-weight:850;

  background:#F3F1F7;

  color:var(--muted);
}

.badge.success{
  background:#DCFCE7;
  color:#15803D;
}

.badge.warning{
  background:#FEF3C7;
  color:#B45309;
}

.badge.info{
  background:#DBEAFE;
  color:#1D4ED8;
}


/* =========================================================
   PLAN CARD
========================================================= */

.plan-card{

  position:relative;

  overflow:hidden;
}

.plan-top{

  display:flex;

  align-items:flex-start;

  gap:12px;
}

.plan-category{

  width:52px;
  height:52px;

  flex:none;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:16px;

  background:var(--primary-light);

  font-size:25px;
}

.plan-info{
  flex:1;
  min-width:0;
}

.plan-info h3{

  margin:0 0 4px;

  font-size:17px;
}

.plan-info p{

  color:var(--muted);

  font-size:12px;

  line-height:1.4;
}

.plan-bottom{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:8px;

  margin-top:14px;

  padding-top:12px;

  border-top:1px solid var(--border);
}


/* =========================================================
   GROUP CARD
========================================================= */

.group-card{

  display:flex;

  gap:12px;

  align-items:center;
}

.group-icon{

  width:56px;
  height:56px;

  flex:none;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:17px;

  background:
    linear-gradient(
      135deg,
      #EDE5FF,
      #F7F1FF
    );

  font-size:27px;
}


/* =========================================================
   CALENDAR
========================================================= */

.calendar{

  display:grid;

  grid-template-columns:
    repeat(7,1fr);

  gap:5px;
}

.calendar-head{

  text-align:center;

  color:var(--muted);

  font-size:10px;

  font-weight:800;

  padding-bottom:4px;
}

.calendar-day{

  min-height:47px;

  padding:7px 3px;

  border-radius:10px;

  background:#F3F1F7;

  text-align:center;

  font-size:12px;

  position:relative;
}

.calendar-day.today{

  outline:
    2px
    solid
    var(--primary);
}

.calendar-day.event{

  background:#E9DEFF;

  color:#6134C5;

  font-weight:850;
}

.calendar-day .dot{

  width:5px;
  height:5px;

  border-radius:50%;

  background:var(--primary);

  position:absolute;

  bottom:4px;

  left:50%;

  transform:translateX(-50%);
}


/* =========================================================
   MAP
========================================================= */

.map{

  position:relative;

  width:100%;
  height:310px;

  overflow:hidden;

  border-radius:22px;

  background:
    linear-gradient(
      135deg,
      #EDE7FF,
      #DFF5E8
    );

  border:1px solid var(--border);
}

.map::before{

  content:"";

  position:absolute;

  inset:0;

  background-image:

    linear-gradient(
      25deg,
      transparent 47%,
      rgba(255,255,255,.72) 48%,
      transparent 50%
    ),

    linear-gradient(
      115deg,
      transparent 48%,
      rgba(255,255,255,.62) 49%,
      transparent 51%
    );

  opacity:.7;
}

.map-marker{

  position:absolute;

  width:42px;
  height:42px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:white;

  box-shadow:
    0 6px 18px rgba(0,0,0,.15);

  font-size:22px;

  transform:translate(-50%,-50%);

  z-index:2;
}


/* =========================================================
   CHAT LIST
========================================================= */

.chat-list-item{

  display:flex;

  align-items:center;

  gap:12px;

  padding:13px 3px;

  border-bottom:
    1px
    solid
    var(--border);
}

.chat-list-item:last-child{
  border-bottom:0;
}

.chat-preview{

  flex:1;
  min-width:0;
}

.chat-preview strong{

  display:block;

  margin-bottom:3px;
}

.chat-preview p{

  margin:0;

  color:var(--muted);

  font-size:12px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.chat-time{

  color:var(--muted);

  font-size:10px;
}


/* =========================================================
   CHAT WINDOW
========================================================= */

.chat-window{

  position:fixed;

  inset:0;

  z-index:500;

  display:none;

  flex-direction:column;

  background:var(--bg);
}

.chat-window.active{
  display:flex;
}

.chat-header{

  display:flex;

  align-items:center;

  gap:10px;

  padding:
    calc(10px + var(--safe-top))
    14px
    10px;

  background:var(--card);

  border-bottom:
    1px
    solid
    var(--border);
}

.chat-header .icon-btn{
  width:38px;
  height:38px;
}

.chat-messages{

  flex:1;

  overflow-y:auto;

  padding:15px;
}

.message{

  width:max-content;

  max-width:80%;

  padding:
    10px
    13px;

  border-radius:17px;

  background:#EDEAF2;

  margin-bottom:8px;

  font-size:14px;

  line-height:1.4;
}

.message.me{

  margin-left:auto;

  background:var(--primary);

  color:white;
}

.message-time{

  display:block;

  margin-top:3px;

  font-size:9px;

  opacity:.6;

  text-align:right;
}

.chat-input{

  display:flex;

  gap:8px;

  padding:
    10px
    10px
    calc(10px + var(--safe-bottom));

  background:var(--card);

  border-top:
    1px
    solid
    var(--border);
}

.chat-input input{

  flex:1;

  min-width:0;

  border:
    1px
    solid
    var(--border);

  border-radius:15px;

  padding:11px 13px;

  outline:0;

  background:var(--card);

  color:var(--text);
}


/* =========================================================
   PROFILE
========================================================= */

.profile-header{

  display:flex;

  align-items:center;

  gap:15px;

  padding-bottom:16px;
}

.profile-info{
  flex:1;
}

.profile-info h2{
  margin:0 0 4px;
}

.profile-stats{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:8px;

  margin-top:15px;
}

.stat{

  padding:12px 6px;

  text-align:center;

  background:var(--card-2);

  border-radius:14px;

  border:1px solid var(--border);
}

.stat strong{

  display:block;

  font-size:18px;
}

.stat span{

  display:block;

  margin-top:3px;

  color:var(--muted);

  font-size:10px;
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{

  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:200;

  background:
    rgba(255,255,255,.94);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  border-top:
    1px
    solid
    var(--border);

  padding-bottom:var(--safe-bottom);
}

.bottom-nav-inner{

  width:100%;
  max-width:760px;

  margin:auto;

  display:grid;

  grid-template-columns:
    repeat(5,1fr);
}

.nav-btn{

  position:relative;

  border:0;

  background:transparent;

  color:var(--muted);

  padding:
    7px
    3px
    8px;

  font-size:10px;

  font-weight:600;
}

.nav-btn span{

  display:block;

  margin-bottom:2px;

  font-size:21px;

  line-height:1;
}

.nav-btn.active{

  color:var(--primary);

  font-weight:900;
}

.nav-btn.active::before{

  content:"";

  position:absolute;

  top:0;
  left:25%;
  right:25%;

  height:3px;

  border-radius:0 0 5px 5px;

  background:var(--primary);
}


/* =========================================================
   MODALS
========================================================= */

.modal-overlay{

  position:fixed;

  inset:0;

  z-index:1000;

  display:none;

  align-items:flex-end;

  justify-content:center;

  padding:12px;

  background:
    rgba(0,0,0,.55);

  backdrop-filter:blur(3px);
}

.modal-overlay.active{
  display:flex;
}

.modal{

  width:100%;

  max-width:760px;

  max-height:92vh;

  overflow-y:auto;

  background:var(--card);

  border-radius:
    25px
    25px
    18px
    18px;

  padding:20px;

  animation:
    modalIn .2s ease;
}

@keyframes modalIn{

  from{
    transform:translateY(30px);
    opacity:0;
  }

  to{
    transform:translateY(0);
    opacity:1;
  }
}

.modal-header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  margin-bottom:16px;
}

.modal-header h2{

  margin:0;

  font-size:21px;
}

.close-btn{

  border:0;

  width:36px;
  height:36px;

  border-radius:50%;

  background:#F1EFF5;

  color:var(--text);

  font-size:18px;
}


/* =========================================================
   FORMS
========================================================= */

.form-group{

  margin-bottom:13px;
}

.form-group label{

  display:block;

  margin-bottom:6px;

  font-size:12px;

  font-weight:800;
}

.form-group input,
.form-group textarea,
.form-group select{

  width:100%;

  padding:
    12px
    13px;

  border:
    1px
    solid
    var(--border);

  border-radius:14px;

  outline:0;

  background:var(--card);

  color:var(--text);
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{

  border-color:var(--primary);

  box-shadow:
    0 0 0 3px
    rgba(139,92,246,.10);
}

.form-group textarea{

  min-height:100px;

  resize:vertical;
}


/* =========================================================
   AI
========================================================= */

.ai-box{

  padding:17px;

  border-radius:21px;

  background:
    linear-gradient(
      135deg,
      #F0EAFF,
      #F9F7FF
    );
}

.ai-title{

  display:flex;

  align-items:center;

  gap:8px;

  margin-bottom:9px;

  font-weight:950;

  color:#6134C5;
}

.ai-response{

  line-height:1.55;

  font-size:14px;
}


/* =========================================================
   NOTIFICATION DOT
========================================================= */

.notification-dot{

  position:absolute;

  top:5px;
  right:5px;

  width:8px;
  height:8px;

  border-radius:50%;

  background:var(--danger);

  border:2px solid var(--card);
}


/* =========================================================
   EMPTY STATES
========================================================= */

.empty{

  padding:30px 15px;

  text-align:center;

  color:var(--muted);
}

.empty-icon{

  font-size:42px;

  margin-bottom:10px;
}

.empty strong{

  display:block;

  margin-bottom:5px;

  color:var(--text);
}


/* =========================================================
   LOADER
========================================================= */

.loader{

  width:25px;
  height:25px;

  margin:20px auto;

  border:
    3px
    solid
    var(--primary-light);

  border-top-color:var(--primary);

  border-radius:50%;

  animation:
    spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =========================================================
   TOGGLE
========================================================= */

.toggle{

  position:relative;

  width:48px;
  height:28px;

  flex:none;

  border:0;

  border-radius:999px;

  background:#D6D2DE;
}

.toggle::after{

  content:"";

  position:absolute;

  top:3px;
  left:3px;

  width:22px;
  height:22px;

  border-radius:50%;

  background:white;

  transition:
    transform .2s;
}

.toggle.on{

  background:var(--primary);
}

.toggle.on::after{
  transform:translateX(20px);
}


/* =========================================================
   SETTINGS ROW
========================================================= */

.settings-row{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;

  padding:14px 0;

  border-bottom:
    1px
    solid
    var(--border);
}

.settings-row:last-child{
  border-bottom:0;
}

.settings-left{
  flex:1;
}

.settings-left strong{

  display:block;

  font-size:14px;
}

.settings-left span{

  display:block;

  margin-top:3px;

  color:var(--muted);

  font-size:11px;

  line-height:1.4;
}


/* =========================================================
   GRID UTILITIES
========================================================= */

.grid{
  display:grid;
  gap:10px;
}

.grid-2{
  grid-template-columns:repeat(2,1fr);
}

.grid-3{
  grid-template-columns:repeat(3,1fr);
}

.row{
  display:flex;
  align-items:center;
  gap:10px;
}

.space-between{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}


/* =========================================================
   SCANNER
========================================================= */

.scanner-options{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:10px;
}

.scanner-option{

  padding:
    20px
    10px;

  border:
    1px
    solid
    var(--border);

  background:var(--card);

  border-radius:18px;

  text-align:center;
}

.scanner-option .emoji{

  display:block;

  font-size:31px;

  margin-bottom:8px;
}


/* =========================================================
   DARK MODE
========================================================= */

body.dark{

  --bg:#111016;
  --card:#1C1922;
  --card-2:#211E28;

  --text:#F5F3FA;
  --muted:#AAA5B4;

  --border:#302B38;
}

body.dark .bottom-nav{

  background:
    rgba(28,25,34,.96);
}

body.dark .app-header{

  background:
    rgba(17,16,22,.92);
}

body.dark .message{

  background:#302B38;
}

body.dark .close-btn{

  background:#302B38;
}

body.dark .map{

  background:
    linear-gradient(
      135deg,
      #29213D,
      #183128
    );
}

body.dark .quick-card,
body.dark .card,
body.dark .search-box{
  box-shadow:none;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:520px){

  .quick-grid{
    grid-template-columns:
      repeat(4,1fr);
  }

  .hero h1{
    font-size:28px;
  }
}

@media(max-width:430px){

  .screen{
    padding-left:14px;
    padding-right:14px;
  }

  .quick-grid{
    grid-template-columns:
      repeat(3,1fr);
  }

  .profile-stats{
    gap:5px;
  }

  .grid-2{
    grid-template-columns:1fr;
  }
}

@media(min-width:761px){

  .bottom-nav{
    left:50%;
    right:auto;

    width:760px;

    transform:translateX(-50%);
  }

}


/* =========================================================
   ACCESSIBILITY
========================================================= */

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible{

  outline:
    3px
    solid
    rgba(139,92,246,.35);

  outline-offset:2px;
}


/* =========================================================
   SAFE IMAGE FALLBACK
========================================================= */

.image-placeholder{

  display:flex;

  align-items:center;
  justify-content:center;

  width:100%;
  height:100%;

  background:
    linear-gradient(
      135deg,
      #EDE7FF,
      #F5F1FF
    );

  color:var(--primary);

  font-size:40px;
}

</style>
